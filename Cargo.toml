[workspace]
resolver = "2"
members = [
    "crates/cubehash-core",
    "crates/cubehash-ffi",
    "crates/cubehash-cli",
    "crates/cubehash-chat",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["CubeHash Authors"]
description = "General-purpose hierarchical, self-healing, hardware-bound cellular cube cryptography engine"

[workspace.dependencies]
blake2 = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
futures-util = "0.3"
getrandom = "0.2"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
rustls-pki-types = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
webpki-roots = "0.26"
windows-sys = "0.61"
x25519-dalek = { version = "2.0", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.8", features = ["derive"] }
