version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tehran"
    open-pull-requests-limit: 5
    groups:
      rustcrypto-and-core:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "security-update"
      - "automated-pr"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tehran"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "ci"
      - "automated-pr"
    commit-message:
      prefix: "chore(ci)"
